<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小遊戲中心 - Mini Games Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🎮 小遊戲中心</h1>
        <p>選擇一個遊戲開始遊玩！</p>
    </header>

    <div class="games-container">
        <!-- Snake Game Card -->
        <div class="game-card">
            <div class="game-preview snake-preview">
                <div class="snake-demo"></div>
            </div>
            <div class="game-info">
                <h2>🐍 貪吃蛇</h2>
                <p>經典貪吃蛇遊戲！使用方向鍵控制蛇吃食物，小心不要撞到自己！</p>
                <a href="games/snake/index.html" class="play-button">開始遊玩</a>
            </div>
        </div>

        <!-- 2048 Game Card -->
        <div class="game-card">
            <div class="game-preview game-2048-preview">
                <div class="demo-2048">2048</div>
            </div>
            <div class="game-info">
                <h2>🔢 2048</h2>
                <p>熱門數字拼圖遊戲！合併相同數字的方塊，挑戰達到 2048！</p>
                <a href="games/2048/index.html" class="play-button">開始遊玩</a>
            </div>
        </div>

        <!-- Brick Breaker Card -->
        <div class="game-card">
            <div class="game-preview brick-preview">
                <div class="brick-demo"></div>
            </div>
            <div class="game-info">
                <h2>🧱 打磚塊</h2>
                <p>經典街機遊戲！移動擋板彈球擊碎所有磚塊，挑戰高分！</p>
                <a href="games/brick-breaker/index.html" class="play-button">開始遊玩</a>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2025 Mini Games Hub | 享受遊戲時光！</p>
    </footer>
</body>
</html>
